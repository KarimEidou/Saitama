    <title>Destruction Harness — Serious Punch Through City Z</title>
    <!--
      DESTRUCTION VERIFICATION HARNESS

      The one question a unit test cannot answer: when a full-charge serious
      punch goes through a city block, does it READ as buildings collapsing, or
      as geometry being switched off?

      Everything here is the real thing. The city comes out of
      `src/world/city/**` pre-fractured. The debris bodies are the real Rapier
      pool from `src/physics/**`, 300 hard cap, LRU and all. The persistent
      damage is the real 8 KB `ChunkDamageState` from
      `src/world/streaming/**`. The punch is a real `ShockwaveFired` on a real
      event bus. The destruction system subscribes to it and knows about none
      of them — every collaborator arrives through the structural ports in
      `src/gameplay/destruction/ports.ts`, assigned with no cast, which is what
      this file also proves.

      Three shots go to `docs/screenshots/`:
        before          the block intact
        mid-collapse    the frame that has to sell it
        after           what the player is left standing in

      Plus the checks a picture cannot make: that the normalised `aDestroyed`
      attribute really does remove triangles on a real GPU pipeline (and that
      writing 1 instead of 255 really does not), that the 300-debris and
      8-ragdoll caps hold, that damage survives a stream-out/stream-in round
      trip, and that the same seed reproduces the same rubble.

      NO FRAME TIMES ARE REPORTED. This runs on SwiftShader, a CPU software
      rasteriser; a millisecond here says nothing about a phone.

      Playwright drives `window.__DESTRUCTION_HARNESS__`.
    -->
