<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural humanoid — mesh harness</title>
    <style>
      :root {
        --ink: #e9edf3;
        --dim: #96a1b0;
        --rule: #2a3140;
        --panel: #10141b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #070910;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        width: 1800px;
        height: 1200px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 1800px;
        height: 1200px;
      }

      /* ---- overlay chrome ------------------------------------------------ */
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        transform: translate(-50%, 0);
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--ink);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        text-align: center;
      }
      .label small {
        display: block;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .panel-title {
        position: absolute;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .divider {
        position: absolute;
        background: var(--rule);
      }
      #readout {
        position: absolute;
        top: 14px;
        left: 18px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--dim);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      }
      #readout b {
        color: var(--ink);
        font-weight: 600;
      }
      #readout .ok {
        color: #56d68a;
      }
      #readout .bad {
        color: #ff6b6b;
      }
      #title {
        position: absolute;
        top: 14px;
        right: 18px;
        text-align: right;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      }
      #title b {
        display: block;
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--ink);
      }
      #error {
        position: absolute;
        inset: 40px;
        display: none;
        white-space: pre-wrap;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        color: #ff8b8b;
        background: rgba(10, 6, 8, 0.94);
        border: 1px solid #542;
        padding: 20px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div class="overlay" id="overlay"></div>
      <div id="readout">booting…</div>
      <div id="title"><b>Procedural humanoid</b>mesh + skeleton generator</div>
      <pre id="error"></pre>
    </div>
    <script type="module" src="./humanoid.ts"></script>
  </body>
</html>
