# Build City Z and publish it to GitHub Pages.
#
# This exists so the game can be played with nothing but a phone. The assets are
# not in the repo -- 1.65 GB of CC0 material from Poly Haven, which GitHub could
# not hold (100 MB per file, no git-lfs here) -- so CI regenerates them from the
# committed manifest and lockfile, then serves the result.
#
# Two jobs stand in front of the deploy:
#   `checks`  the cheap gate -- typecheck, lint, tests, binary guard, attribution.
#             No asset fetch, no build. Runs on every push and every pull request.
#   `build`   the expensive publish path. `needs: checks`, and only runs for the
#             repository's default branch or a manual dispatch.
#
# Trigger it from the Actions tab (including the GitHub mobile app), or let it
# run on a push to the default branch.
name: Deploy to Pages

on:
  push:
    # Every branch: the point of a push run is the `checks` gate, and work here
    # happens on long-lived feature branches. Publishing is gated separately by
    # the `build` job's `if:`, so a feature branch is checked without
    # republishing the site.
    #
    # Markdown-only pushes still skip the workflow, as they always have; a
    # pull_request run (unfiltered, below) covers documentation changes.
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one supersede a queued older one, but
# do not kill a run that is already publishing. Scoped per ref: only the default
# branch auto-publishes, so every publishing run still lands in one group, while
# a 90-minute publish cannot hold the two-minute gate on another branch behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing here needs the 1.65 GB asset fetch, so this is minutes rather than
  # the build job's 90-minute budget. It exists because the workflow used to be
  # publish-only: a push that broke the type-checker, the lint gate or the unit
  # tests deployed anyway, and `tools/attribution.ts --check` -- which README.md,
  # docs/asset-pipeline.md and ATTRIBUTION.md's own header all describe as a CI
  # gate -- ran nowhere.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Refuses tracked binary game assets outside docs/screenshots/, and any
      # tracked file over 5 MB. Needs the git metadata actions/checkout leaves.
      - name: Binary guard
        run: npm run guard

      # ATTRIBUTION.md is generated, never hand-written: --check regenerates it
      # in memory and diffs, exiting 1 on drift.
      - name: Attribution up to date
        run: npx tsx tools/attribution.ts --check

  build:
    needs: checks
    # Only the default branch publishes. The trigger used to hardcode a branch
    # name that development had already moved off, so every push was a silent
    # no-op and the Pages site served whatever that branch last produced;
    # deriving the name from the repository means it cannot go stale again.
    # A manual dispatch publishes whatever ref it was fired from.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The expensive step is `npm run assets`: a 1.65 GB fetch plus KTX2
      # encoding, which is CPU-bound and takes the better part of ten minutes on
      # a 4-core runner. Cache the PROCESSED output rather than the raw
      # downloads -- it is a fifth of the size and skips both stages on a hit.
      # The key covers the manifests and the pipeline, so changing either
      # correctly forces a rebuild.
      - name: Restore processed assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: public/assets
          key: assets-v1-${{ hashFiles('tools/manifest/*.json', 'assets/assets.lock.json', 'tools/*.ts', 'tools/lib/*.ts') }}

      # `--tier mobile` is load-bearing, not an optimisation. `assets:process`
      # defaults to ALL tiers, and a 4K ultra albedo is ~28 s of single-asset
      # ETC1S encoding; on a 2-core runner that overran a 90-minute job, and
      # every ultra and high output it produced was then deleted by the prune
      # below. Build only the tier that ships.
      - name: Fetch and process assets (mobile tier only)
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          npm run assets:fetch
          npm run assets:process -- --tier mobile

      # `scripts/build-web.ts` runs `tools/build-characters.ts` itself, before
      # vite, then asserts `dist/assets/chr/characters.runtime.json` exists and
      # fails the job if it does not. That bake is UNCONDITIONAL on purpose: a
      # cache hit proves a `public/assets` tree was restored, not that it holds
      # `chr/`, and the roster lives under `src/characters/`, which the cache key
      # does not hash -- skipping on a hit would ship yesterday's characters, or
      # none. On a hit `assets/source/` is absent, so the CC0 detail tiles are
      # skipped with a warning; that costs grain, not silhouettes.
      #
      # This step also prunes the build to a single asset tier: 262 MB -> ~135 MB.
      - name: Build (mobile tier)
        run: npx tsx scripts/build-web.ts

      - name: Report what is being published
        run: |
          echo "dist: $(du -sh dist | cut -f1)"
          echo "largest file: $(find dist -type f -printf '%s %p\n' | sort -rn | head -1 | awk '{printf "%.1f MB  %s", $1/1048576, $2}')"
          echo "high/ultra files that should not be here: $(find dist \( -name '*.high.*' -o -name '*.ultra.*' \) | wc -l)"

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically if it is not already. If the token is
          # not allowed to, this fails loudly and Pages can be switched on by
          # hand in Settings -> Pages -> Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # `build` is skipped on a non-publishing ref, which skips this job too.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
